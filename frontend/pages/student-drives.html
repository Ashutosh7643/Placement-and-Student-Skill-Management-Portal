<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Drives | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="panel">
          <div class="panel-header">
            <h2>Search &amp; Filter Placement Drives</h2>
          </div>
          <div class="panel-body">
            <form id="driveFilterForm" class="toolbar">
              <div class="form-group">
                <label for="searchQ">Search Company / Role / Skill</label>
                <input type="text" id="searchQ" placeholder="e.g., Infosys, Node.js, Software" />
              </div>
              <div class="form-group">
                <label for="filterStatus">Drive Status</label>
                <select id="filterStatus">
                  <option value="all">All Statuses</option>
                  <option value="Open" selected>Open</option>
                  <option value="Upcoming">Upcoming</option>
                  <option value="Closed">Closed</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
              <div class="form-group">
                <label for="filterEligibility">My Eligibility</label>
                <select id="filterEligibility">
                  <option value="all">All Drives</option>
                  <option value="eligible">Eligible Only</option>
                  <option value="not_eligible">Not Eligible</option>
                </select>
              </div>
              <div class="form-group">
                <label for="filterMinPackage">Min Package (LPA)</label>
                <input type="number" id="filterMinPackage" min="0" step="0.5" placeholder="e.g., 4" />
              </div>
              <div>
                <button type="submit" class="btn btn-primary">Apply Filters</button>
                <button type="button" class="btn btn-secondary" id="resetFilterBtn">Reset</button>
              </div>
            </form>

            <div class="table-wrap" id="drivesTableWrap">Loading placement drives...</div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/student-drives.js"></script>
</body>
</html>
