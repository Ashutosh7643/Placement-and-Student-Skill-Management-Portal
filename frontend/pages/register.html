<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-body">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="/" class="brand-lockup" style="text-decoration:none;">
        <img src="/images/dbuu-crest.svg" alt="DBUU Emblem" />
        <div>
          <div class="brand-title">Dev Bhoomi Uttarakhand University</div>
          <div class="brand-subtitle">Placement &amp; Student Skill Management Portal</div>
        </div>
      </a>
      <nav class="public-nav">
        <a href="/">Home</a>
        <a href="/pages/login.html" class="nav-cta">Student Login</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card auth-card-wide">
      <div class="auth-card-header">
        <h1>Student Registration</h1>
        <p>Create your student account and academic profile to access campus placement drives.</p>
      </div>

      <div id="authAlert" class="hidden"></div>

      <form id="registerForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="e.g., Ankit Negi" required />
          </div>
          <div class="form-group">
            <label for="email">University / Personal Email</label>
            <input type="email" id="email" name="email" placeholder="name@student.dbuu.ac.in" required />
          </div>
          <div class="form-group">
            <label for="password">Password (min 6 chars)</label>
            <input type="password" id="password" name="password" minlength="6" required />
          </div>
          <div class="form-group">
            <label for="rollNumber">Student ID / Roll Number</label>
            <input type="text" id="rollNumber" name="rollNumber" placeholder="e.g., DBUU22CSE045" required />
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" value="Computer Science &amp; Engineering" required />
          </div>
          <div class="form-group">
            <label for="branch">Branch</label>
            <select id="branch" name="branch" required>
              <option value="CSE">CSE</option>
              <option value="IT">IT</option>
              <option value="AI &amp; ML">AI &amp; ML</option>
              <option value="DATA SCIENCE">DATA SCIENCE</option>
              <option value="ECE">ECE</option>
              <option value="EEE">EEE</option>
              <option value="ME">ME</option>
              <option value="CE">CE</option>
            </select>
          </div>
          <div class="form-group">
            <label for="academicYear">Academic Year</label>
            <select id="academicYear" name="academicYear" required>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year" selected>3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div class="form-group">
            <label for="semester">Current Semester</label>
            <input type="number" id="semester" name="semester" min="1" max="8" value="6" required />
          </div>
          <div class="form-group">
            <label for="cgpa">Current CGPA (0 - 10)</label>
            <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01" placeholder="e.g., 7.85" required />
          </div>
          <div class="form-group">
            <label for="backlogs">Active Backlogs</label>
            <input type="number" id="backlogs" name="backlogs" min="0" value="0" required />
          </div>
          <div class="form-group full-width">
            <label for="phone">Contact Phone (Optional)</label>
            <input type="text" id="phone" name="phone" placeholder="10-digit mobile number" />
          </div>
        </div>

        <div style="margin-top:18px;">
          <button type="submit" class="btn btn-primary" style="width:100%;" id="registerBtn">Create Student Account</button>
        </div>
      </form>

      <div class="auth-footer-links">
        <span>Already registered? <a href="/pages/login.html">Sign in here</a></span>
        <a href="/">Back to Home</a>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
