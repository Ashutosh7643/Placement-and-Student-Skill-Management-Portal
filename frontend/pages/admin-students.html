<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management | DBUU Admin Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="panel">
          <div class="panel-header">
            <h2>Registered Students Directory</h2>
          </div>
          <div class="panel-body">
            <form id="studentFilterForm" class="toolbar">
              <div class="form-group">
                <label for="filterQ">Search Name / Roll No / Email</label>
                <input type="text" id="filterQ" placeholder="e.g., Aarav, DBUU22CSE001" />
              </div>
              <div class="form-group">
                <label for="filterBranch">Branch</label>
                <select id="filterBranch">
                  <option value="all">All Branches</option>
                  <option value="CSE">CSE</option>
                  <option value="IT">IT</option>
                  <option value="AI &amp; ML">AI &amp; ML</option>
                  <option value="DATA SCIENCE">DATA SCIENCE</option>
                  <option value="ECE">ECE</option>
                  <option value="EEE">EEE</option>
                  <option value="ME">ME</option>
                  <option value="CE">CE</option>
                </select>
              </div>
              <div class="form-group">
                <label for="filterMinCgpa">Min CGPA</label>
                <input type="number" id="filterMinCgpa" min="0" max="10" step="0.1" placeholder="e.g., 7.0" />
              </div>
              <div class="form-group">
                <label for="filterMaxBacklogs">Max Backlogs</label>
                <input type="number" id="filterMaxBacklogs" min="0" placeholder="e.g., 0" />
              </div>
              <div>
                <button type="submit" class="btn btn-primary">Filter</button>
                <button type="button" class="btn btn-secondary" id="resetStudentFilterBtn">Reset</button>
              </div>
            </form>

            <div class="table-wrap" id="studentsTableWrap">Loading students...</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Student Details & Edit Modal -->
  <div id="studentModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="studentModalTitle">Student Record</h3>
        <button type="button" class="btn btn-secondary btn-sm" id="closeStudentModalBtn">Close</button>
      </div>
      <div class="modal-body" id="studentModalBody">Loading...</div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-students.js"></script>
</body>
</html>
