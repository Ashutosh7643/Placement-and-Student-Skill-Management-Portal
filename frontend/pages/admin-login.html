<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-body">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="/" class="brand-lockup" style="text-decoration:none;">
        <img src="/images/dbuu-crest.svg" alt="DBUU Emblem" />
        <div>
          <div class="brand-title">Dev Bhoomi Uttarakhand University</div>
          <div class="brand-subtitle">Training &amp; Placement Cell — Administration</div>
        </div>
      </a>
      <nav class="public-nav">
        <a href="/">Home</a>
        <a href="/pages/login.html" class="nav-cta">Student Login</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1>Placement Cell Admin Login</h1>
        <p>Authorized Training &amp; Placement administrators only.</p>
      </div>

      <div id="authAlert" class="hidden"></div>

      <form id="adminLoginForm">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="email">Admin Email Address</label>
          <input type="email" id="email" name="email" placeholder="admin@dbuu.ac.in" required />
        </div>
        <div class="form-group" style="margin-bottom:16px;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter admin password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="adminLoginBtn">Sign In as Admin</button>
      </form>

      <div class="auth-footer-links">
        <a href="/pages/login.html">Switch to Student Login</a>
        <a href="/">Portal Home</a>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
