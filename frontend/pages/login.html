<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-body">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="/" class="brand-lockup" style="text-decoration:none;">
        <img src="/images/dbuu-crest.svg" alt="DBUU Emblem" />
        <div>
          <div class="brand-title">Dev Bhoomi Uttarakhand University</div>
          <div class="brand-subtitle">Placement &amp; Student Skill Management Portal</div>
        </div>
      </a>
      <nav class="public-nav">
        <a href="/">Home</a>
        <a href="/pages/register.html">Student Registration</a>
        <a href="/pages/admin-login.html" class="nav-cta">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1>Student Login</h1>
        <p>Sign in with your university student credentials to manage skills and apply for drives.</p>
      </div>

      <div id="authAlert" class="hidden"></div>

      <form id="studentLoginForm">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="student@student.dbuu.ac.in" required />
        </div>
        <div class="form-group" style="margin-bottom:16px;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="loginSubmitBtn">Sign In as Student</button>
      </form>

      <div class="auth-footer-links">
        <span>New student? <a href="/pages/register.html">Register here</a></span>
        <a href="/pages/admin-login.html">T&amp;P Admin Login</a>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
