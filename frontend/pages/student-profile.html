<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="panel">
          <div class="panel-header">
            <h2>Academic &amp; Contact Profile</h2>
          </div>
          <div class="panel-body">
            <form id="profileForm">
              <div class="form-grid">
                <div class="form-group">
                  <label for="name">Full Name</label>
                  <input type="text" id="name" required />
                </div>
                <div class="form-group">
                  <label for="email">Email Address (Read-only)</label>
                  <input type="email" id="email" disabled />
                </div>
                <div class="form-group">
                  <label for="rollNumber">University Roll Number / Student ID</label>
                  <input type="text" id="rollNumber" required />
                </div>
                <div class="form-group">
                  <label for="department">Department</label>
                  <input type="text" id="department" required />
                </div>
                <div class="form-group">
                  <label for="branch">Branch</label>
                  <select id="branch" required>
                    <option value="CSE">CSE</option>
                    <option value="IT">IT</option>
                    <option value="AI &amp; ML">AI &amp; ML</option>
                    <option value="DATA SCIENCE">DATA SCIENCE</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="ME">ME</option>
                    <option value="CE">CE</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="academicYear">Academic Year</label>
                  <select id="academicYear" required>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="semester">Current Semester (1 - 8)</label>
                  <input type="number" id="semester" min="1" max="8" required />
                </div>
                <div class="form-group">
                  <label for="cgpa">Current CGPA (0 - 10)</label>
                  <input type="number" id="cgpa" min="0" max="10" step="0.01" required />
                </div>
                <div class="form-group">
                  <label for="backlogs">Active Backlogs</label>
                  <input type="number" id="backlogs" min="0" required />
                </div>
                <div class="form-group">
                  <label for="phone">Contact Phone</label>
                  <input type="text" id="phone" placeholder="10-digit mobile number" />
                </div>
                <div class="form-group">
                  <label for="linkedinUrl">LinkedIn Profile URL</label>
                  <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/..." />
                </div>
                <div class="form-group">
                  <label for="githubUrl">GitHub Profile URL</label>
                  <input type="url" id="githubUrl" placeholder="https://github.com/..." />
                </div>
                <div class="form-group full-width">
                  <label for="address">Address</label>
                  <input type="text" id="address" placeholder="City, State" />
                </div>
                <div class="form-group full-width">
                  <label for="bio">Career Summary / Bio</label>
                  <textarea id="bio" maxlength="500" placeholder="Short summary of your career focus and strengths..."></textarea>
                </div>
              </div>
              <div style="margin-top:16px;">
                <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Profile Changes</button>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/student-profile.js"></script>
</body>
</html>
