<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Management | DBUU Admin Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="panel">
          <div class="panel-header">
            <h2>Manage Student Applications</h2>
          </div>
          <div class="panel-body">
            <form id="appFilterForm" class="toolbar">
              <div class="form-group">
                <label for="appSearchQ">Search Student / Roll / Company</label>
                <input type="text" id="appSearchQ" placeholder="e.g., Aarav, DBUU22CSE001, Rubico" />
              </div>
              <div class="form-group">
                <label for="appFilterDrive">Placement Drive</label>
                <select id="appFilterDrive">
                  <option value="all">All Drives</option>
                </select>
              </div>
              <div class="form-group">
                <label for="appFilterBranch">Branch</label>
                <select id="appFilterBranch">
                  <option value="all">All Branches</option>
                  <option value="CSE">CSE</option>
                  <option value="IT">IT</option>
                  <option value="AI &amp; ML">AI &amp; ML</option>
                  <option value="ECE">ECE</option>
                  <option value="EEE">EEE</option>
                  <option value="ME">ME</option>
                  <option value="CE">CE</option>
                </select>
              </div>
              <div class="form-group">
                <label for="appFilterStatus">Application Status</label>
                <select id="appFilterStatus">
                  <option value="all">All Statuses</option>
                  <option value="Applied">Applied</option>
                  <option value="Under Review">Under Review</option>
                  <option value="Shortlisted">Shortlisted</option>
                  <option value="Selected">Selected</option>
                  <option value="Rejected">Rejected</option>
                </select>
              </div>
              <div>
                <button type="submit" class="btn btn-primary">Filter</button>
                <button type="button" class="btn btn-secondary" id="resetAppFilterBtn">Reset</button>
              </div>
            </form>

            <div class="table-wrap" id="adminAppsTableWrap">Loading applications...</div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/admin-applications.js"></script>
</body>
</html>
