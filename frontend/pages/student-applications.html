<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="panel">
          <div class="panel-header">
            <h2>Placement Application History</h2>
            <div style="display:flex;gap:8px;align-items:center;">
              <label for="appStatusFilter" style="margin:0;">Status:</label>
              <select id="appStatusFilter" style="width:auto;">
                <option value="all">All Statuses</option>
                <option value="Applied">Applied</option>
                <option value="Under Review">Under Review</option>
                <option value="Shortlisted">Shortlisted</option>
                <option value="Selected">Selected</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
          </div>
          <div class="panel-body">
            <div class="table-wrap" id="applicationsTableWrap">Loading applications...</div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/student-applications.js"></script>
</body>
</html>
