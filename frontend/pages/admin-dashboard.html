<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="stats-strip" id="adminStatsStrip">
          <div class="stat-tile"><div class="stat-label">Registered Students</div><div class="stat-value">-</div></div>
          <div class="stat-tile"><div class="stat-label">Companies</div><div class="stat-value">-</div></div>
          <div class="stat-tile"><div class="stat-label">Open / Total Drives</div><div class="stat-value">-</div></div>
          <div class="stat-tile"><div class="stat-label">Total Applications</div><div class="stat-value">-</div></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Application Status Summary (Live MongoDB Counts)</h2>
            <a href="/pages/admin-applications.html" class="btn btn-secondary btn-sm">Manage Applications</a>
          </div>
          <div class="panel-body" id="statusSummaryBody">Loading...</div>
        </section>

        <div class="two-col-grid">
          <section class="panel">
            <div class="panel-header">
              <h2>Recent Applications</h2>
              <a href="/pages/admin-applications.html" class="btn btn-secondary btn-sm">View All</a>
            </div>
            <div class="panel-body">
              <div class="table-wrap" id="recentAppsWrap">Loading...</div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>Recent Placement Drives</h2>
              <a href="/pages/admin-drives.html" class="btn btn-secondary btn-sm">Manage Drives</a>
            </div>
            <div class="panel-body">
              <div class="table-wrap" id="recentDrivesWrap">Loading...</div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/admin-dashboard.js"></script>
</body>
</html>
