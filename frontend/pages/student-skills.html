<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Skills | DBUU Placement Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-column">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-area">
        <div id="pageAlert" class="hidden"></div>

        <section class="panel">
          <div class="panel-header">
            <h2 id="skillFormHeading">Add Technical or Soft Skill</h2>
            <button type="button" class="btn btn-secondary btn-sm hidden" id="cancelSkillEditBtn">Cancel Edit</button>
          </div>
          <div class="panel-body">
            <form id="skillForm">
              <input type="hidden" id="editingSkillId" />
              <div class="form-grid-3">
                <div class="form-group">
                  <label for="skillName">Skill Name</label>
                  <input type="text" id="skillName" placeholder="e.g., JavaScript, SQL, Communication" required />
                </div>
                <div class="form-group">
                  <label for="skillCategory">Category</label>
                  <select id="skillCategory" required>
                    <option value="technical">Technical Skill</option>
                    <option value="soft">Soft Skill</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="skillProficiency">Proficiency Level</label>
                  <select id="skillProficiency" required>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate" selected>Intermediate</option>
                    <option value="Advanced">Advanced</option>
                  </select>
                </div>
              </div>
              <div style="margin-top:14px;">
                <button type="submit" class="btn btn-primary" id="skillSubmitBtn">Add Skill</button>
              </div>
            </form>
          </div>
        </section>

        <div class="two-col-grid">
          <section class="panel">
            <div class="panel-header">
              <h2>Technical Skills (<span id="techCount">0</span>)</h2>
            </div>
            <div class="panel-body">
              <div class="table-wrap" id="technicalSkillsWrap">Loading...</div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>Soft Skills (<span id="softCount">0</span>)</h2>
            </div>
            <div class="panel-body">
              <div class="table-wrap" id="softSkillsWrap">Loading...</div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/student-skills.js"></script>
</body>
</html>
